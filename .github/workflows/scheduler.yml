# اجرای دستی /api/cron (زمان‌بند اصلی داخل خود برنامه روی VPS است و سرور نمی‌خوابد).
# نیاز به دو Secret در تنظیمات ریپو: RUN_TOKEN و SERVICE_URL
name: hourly-sync
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake service and trigger sync if due
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: |
          if [ -z "$RUN_TOKEN" ] || [ -z "$SERVICE_URL" ]; then echo "secrets not set"; exit 0; fi
          for i in 1 2 3 4; do
            if curl -fsS -m 90 -H "X-Run-Token: $RUN_TOKEN" "$SERVICE_URL/api/cron"; then exit 0; fi
            sleep 20
          done
          exit 1
