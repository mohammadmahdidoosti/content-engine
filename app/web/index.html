<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مدیر بازاریابی کاروان صنعت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#fffefb; --surface-2:#efebe2; --ink:#1d2621; --ink-2:#526058; --ink-3:#86918a;
  --line:#e1dccf; --accent:#2c6a4d; --accent-ink:#fff; --accent-soft:#e1eee6;
  --amber:#a86e12; --amber-soft:#faefd9; --red:#b23f2c; --red-soft:#f8e3de; --blue:#2a5a8c; --blue-soft:#e1ebf5;
  --tg:#e8f3eb; --shadow:0 1px 2px rgba(29,38,33,.05),0 6px 18px rgba(29,38,33,.06); --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --surface-2:#212925; --ink:#e7ebe8; --ink-2:#a7b1ab; --ink-3:#76807a;
  --line:#2c3530; --accent:#5fb08a; --accent-ink:#0d1310; --accent-soft:#1e3228;
  --amber:#e0a84a; --amber-soft:#33291a; --red:#e27a66; --red-soft:#3a221d; --blue:#82b2e2; --blue-soft:#1c2a38;
  --tg:#1c2a22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --surface-2:#212925; --ink:#e7ebe8; --ink-2:#a7b1ab; --ink-3:#76807a;
  --line:#2c3530; --accent:#5fb08a; --accent-ink:#0d1310; --accent-soft:#1e3228;
  --amber:#e0a84a; --amber-soft:#33291a; --red:#e27a66; --red-soft:#3a221d; --blue:#82b2e2; --blue-soft:#1c2a38;
  --tg:#1c2a22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:-4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:6px 13px;border-radius:9px;font-weight:600;font-size:13.5px}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.ghost:hover{background:var(--surface-2)}
.ghost.sm{padding:2px 9px;font-size:12px}
.danger{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card>h2,.card>header{font-size:15px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pad{padding:14px 16px}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2>*,.grid3>*,.stats>*{min-width:0}
.rec{min-width:0;overflow:hidden}
.prods{max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.stat b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5}
.stat span{color:var(--ink-3);font-size:12.5px}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin:10px 0 4px;font-weight:600}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 9px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.b-ok{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--amber-soft);color:var(--amber)}
.b-bad{background:var(--red-soft);color:var(--red)} .b-info{background:var(--blue-soft);color:var(--blue)}
.pulse::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:5px;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.empty{color:var(--ink-3);text-align:center;padding:26px 12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--ink-3);font-weight:600;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.rec h3{margin:0;font-size:14.5px;line-height:1.6}
.rec .why{color:var(--accent);font-weight:600;font-size:13px}
.rec .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-3);font-size:12.5px}
.rec .meta b{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--surface-2);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2)}
.chip.kw{background:var(--blue-soft);color:var(--blue);cursor:pointer;border:0}
.prods{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.prod{flex:none;width:120px;font-size:11.5px;line-height:1.5;text-decoration:none;color:var(--ink-2)}
.prod img{width:120px;height:90px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:3px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.err{background:var(--red-soft);color:var(--red);border-radius:9px;padding:7px 11px;font-size:13px;margin-top:8px}
.note{background:var(--blue-soft);color:var(--blue);border-radius:9px;padding:9px 12px;font-size:13px}
.warnbox{background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:9px 12px;font-size:13px}
pre.ad{white-space:pre-wrap;background:var(--tg);border-radius:12px;padding:12px 14px;margin:0;font:inherit;font-size:13.5px;line-height:1.9}
pre.raw{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;max-height:480px;white-space:pre-wrap}
details{border-top:1px solid var(--line)}
details>summary{cursor:pointer;padding:10px 16px;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"◂ ";color:var(--ink-3)}
details[open]>summary::before{content:"▾ "}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.ltr{direction:ltr;unicode-bidi:embed}
.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto 0}
#login .logo{margin:0 auto 12px;width:52px;height:52px;font-size:22px}
/* studio */
.job{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.job:hover,.job.sel{background:var(--surface-2)}
.ticon{width:32px;height:32px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.type{position:relative}.type input{position:absolute;opacity:0;inset:0;cursor:pointer}
.type div{border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;font-size:13px;background:var(--bg)}
.type input:checked+div{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.bubble{background:var(--tg);border-radius:14px 14px 4px 14px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px;line-height:1.9}
.caption{background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px}
.grid2.studio{grid-template-columns:340px 1fr}
.chlist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.chlist label{display:flex;gap:6px;align-items:baseline;cursor:pointer;padding:2px 0}
.grid2.keep{grid-template-columns:1fr 1fr!important}
@media (max-width:920px){.grid2.studio{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="login" class="wrap hidden">
  <div class="card pad">
    <div class="logo">ک</div>
    <h2 style="text-align:center;margin:0 0 4px;font-size:18px">مدیر بازاریابی کاروان صنعت</h2>
    <p class="muted small" style="text-align:center;margin:0 0 14px">برای ورود، مقدار <code>RUN_TOKEN</code> را از بخش Environment سرویس در Render وارد کنید.</p>
    <form id="loginForm">
      <label class="f" for="tok">رمز ورود</label>
      <input type="password" id="tok" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:12px" type="submit">ورود</button>
      <div class="err hidden" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap hidden">
  <header class="top">
    <div class="brand"><div class="logo">ک</div>
      <div><h1>مدیر بازاریابی</h1><small id="today"></small></div></div>
    <div class="inline">
      <button class="ghost" id="themeBtn" aria-label="تغییر تم">🌓</button>
      <button class="ghost" id="logoutBtn">خروج</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#home">خانه</a><a href="#plan">برنامه‌ی تبلیغ</a><a href="#campaigns">کمپین‌ها</a>
    <a href="#channels">کانال‌ها</a><a href="#report">گزارش</a><a href="#map">نقشه</a>
    <a href="#cities">شهرها</a><a href="#assistant">دستیار قیمت</a><a href="#studio">استودیو محتوا</a><a href="#settings">تنظیمات</a>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("ce_token") || "", ME = null, timer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = n => n == null || n === "" ? "–" : Number(n).toLocaleString("fa-IR");
const toman = n => n ? fa(n) + " تومان" : "–";
const mtoman = n => !n ? "–" : (n >= 1e6 ? fa(Math.round(n / 1e5) / 10) + " میلیون" : fa(n));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const ago = iso => { if (!iso) return "–"; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "همین الان"; if (s < 3600) return fa(Math.floor(s/60)) + " دقیقه پیش";
  if (s < 86400) return fa(Math.floor(s/3600)) + " ساعت پیش"; return fa(Math.floor(s/86400)) + " روز پیش"; };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
function copy(text){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("کپی شد"), () => toast("کپی نشد؛ دستی انتخاب کنید")); }

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type":"application/json","X-Run-Token":token}});
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const post = (p, body) => api(p, {method:"POST", body: JSON.stringify(body || {})});

// ---------------- auth / theme ----------------
async function login(t){ token = t; ME = await api("/api/me"); store.set("ce_token", t);
  $("#today").textContent = "امروز " + ME.jalali; $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); route(); }
function logout(){ token = ""; store.del("ce_token"); clearTimeout(timer); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
$("#loginForm").addEventListener("submit", async e => { e.preventDefault(); const er = $("#loginErr"); er.classList.add("hidden");
  try { await login($("#tok").value.trim()); } catch { er.textContent = "رمز ورود درست نیست."; er.classList.remove("hidden"); } });
$("#logoutBtn").onclick = logout;
const applyTheme = t => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("ce_theme"));
$("#themeBtn").onclick = () => { const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
  const t = dark ? "light" : "dark"; store.set("ce_theme", t); applyTheme(t); };

// ---------------- router ----------------
const VIEWS = {home, plan, campaigns, channels, report, map, studio, settings, cities, assistant};
window.addEventListener("hashchange", route);
function route(){ clearTimeout(timer); const v = (location.hash || "#home").slice(1).split("/")[0];
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + v));
  const fn = VIEWS[v] || home; $("#view").innerHTML = '<div class="empty">در حال بارگذاری…</div>';
  fn().catch(e => { if (e.message !== "unauthorized") $("#view").innerHTML = `<div class="err">${esc(e.message)}</div>`; }); }
const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(() => fn().catch(() => {}), ms); };

// ---------------- shared pieces ----------------
function priceBadge(c){ if (!c) return "";
  if (c.status === "cheaper") return `<span class="badge b-ok" title="کمترین قیمت ترب: ${fa(c.market_min)} در ${fa(c.shops)} فروشگاه">زیر بازار ${fa(Math.round((1 - c.ratio) * 100))}٪</span>`;
  if (c.status === "pricier") return `<span class="badge b-bad" title="کمترین قیمت ترب: ${fa(c.market_min)}">گران‌تر ${fa(Math.round((c.ratio - 1) * 100))}٪</span>`;
  if (c.status === "equal") return `<span class="badge">هم‌قیمت بازار</span>`;
  if (c.status === "only_us") return `<span class="badge b-info">در ترب فقط ما</span>`;
  return ""; }
function prodStrip(list){ if (!list?.length) return ""; return `<div class="prods">${list.map(p => `<a class="prod" href="${esc(p.url || p.permalink || "#")}" target="_blank" rel="noopener">
  ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ""}${esc((p.name || "").slice(0, 60))}<br><b>${p.price ? mtoman(p.price) : ""}</b> ${priceBadge(p.price_check)}</a>`).join("")}</div>`; }
function weatherCard(w){ const al = (w && w.alerts) || []; if (!al.length) return "";
  const by = {}; al.forEach(a => (by[a.kind] = by[a.kind] || []).push(a));
  const T = {frost:"ضدیخ بتن، گرمایش مرغداری، عایق، موتورخانه، موتور برق", heat:"پمپ چاه، کولر صنعتی، موتور برق، پمپ ساختمانی، مخزن", rain:"کف‌کش و لجن‌کش، آب‌بندی"};
  return `<div class="card"><header>🌦 هشدار آب‌وهوا (۷ روز آینده) <span class="small muted">به‌روز ${ago(w.at)}</span></header><div class="pad small">
    ${Object.entries(by).map(([k, a]) => `<div style="margin-bottom:6px"><b>${a[0].icon} ${esc(a[0].label)}</b> در ${esc([...new Set(a.map(x => x.province))].join("، "))}
      <div class="muted">فرصت تبلیغ: ${T[k] || ""} — این‌ها در «برنامه‌ی تبلیغ» امتیاز بیشتری گرفته‌اند.</div></div>`).join("")}</div></div>`; }
function recCard(r, opts = {}){
  return `<div class="rec">
    <div class="inline" style="justify-content:space-between"><span class="badge b-info">${esc(r.group_name)}</span>
      ${r.pilot ? `<span class="badge b-ok">پیشنهاد کمپین آزمایشی</span>` : ""}</div>
    <h3>${esc(r.name)}</h3>
    <div class="why">⏱ ${esc(r.why)}</div>
    <div><b>${esc(r.segment)}</b> <span class="muted small">— ${esc((r.provinces || []).join("، "))}</span></div>
    <div class="small muted">${esc((r.cities || "").slice(0, 160))}</div>
    <div class="meta"><span>کالا در سایت: <b>${fa(r.products)}</b> (موجود ${fa(r.in_stock)})</span>
      ${r.p90_price ? `<span>رده‌ی قیمت: <b>تا ${mtoman(r.p90_price)}</b></span>` : ""}
      ${r.budget_toman ? `<span>بودجه‌ی پیشنهادی: <b>${mtoman(r.budget_toman)}</b> (~${fa(r.est_placements)} تبلیغ)</span>` : ""}
      <span>امتیاز: <b>${fa(r.score)}</b></span>
      ${r.margin && r.margin !== 1 ? `<span>سود: <b>${r.margin > 1 ? "زیاد" : "کم"}</b></span>` : ""}
      ${r.price_weight && r.price_weight !== 1 ? `<span>قیمت نسبت به بازار: <b>${r.price_weight > 1 ? "رقابتی" : "گران"}</b></span>` : ""}
      ${r.performance && r.performance !== 1 ? `<span>نتیجه‌ی تبلیغ‌های قبلی: <b>${r.performance > 1 ? "خوب" : "ضعیف"}</b></span>` : ""}
      ${r.past_orders ? `<span>سفارش قبلی از این استان‌ها: <b>${fa(r.past_orders)}</b></span>` : ""}
      ${r.profit_per_sale ? `<span title="از فایل فروش: میانگین سود هر فاکتور${r.past_invoices ? " این دسته" : " (کل فروشگاه)"}">سود هر فروش: <b>${mtoman(r.profit_per_sale)}</b>${r.real_margin_pct ? ` (${fa(r.real_margin_pct)}٪)` : ""}</span>` : ""}
      ${r.max_cost_per_call ? `<span title="سود هر فروش × نرخ تبدیل تماس به خرید؛ تماس گران‌تر از این یعنی ضرر">سقف هزینه‌ی هر تماس: <b>${mtoman(r.max_cost_per_call)}</b></span>` : ""}</div>
    ${opts.full ? `<div class="small"><b>خریدار:</b> ${esc(r.buyers)}</div><div class="small"><b>پیام:</b> ${esc(r.angle)}</div>
      <div class="small"><b>زمان انتشار:</b> ${esc(r.time)}</div>${r.note ? `<div class="small muted">💡 ${esc(r.note)}</div>` : ""}` : ""}
    ${prodStrip(r.examples)}
    <div class="inline" style="justify-content:space-between;margin-top:4px">
      <span class="small muted">${opts.full ? "جست‌وجوی کانال: " + (r.keywords || []).slice(0, 4).map(esc).join(" · ") : ""}</span>
      <button class="btn sm" data-mkcamp="${esc(r.plan_id)}|${r.segment_index}|${r.budget_toman || ""}">ساخت کمپین</button></div>

}

      <div style="margin-bottom:8px">${esc(pf.summary || "")}</div>
      <div class="grid2"><div>${(pf.agri || []).length ? `<b>کشاورزی</b><ul style="margin:4px 0;padding-right:18px">${pf.agri.map(x => `<li>${fact(x)}</li>`).join("")}</ul>` : ""}</div>
      <div>${(pf.industry || []).length ? `<b>صنعت و ساخت‌وساز</b><ul style="margin:4px 0;padding-right:18px">${pf.industry.map(x => `<li>${fact(x)}</li>`).join("")}</ul>` : ""}
        ${(pf.other || []).length ? `<b>سایر</b><ul style="margin:4px 0;padding-right:18px">${pf.other.map(x => `<li>${fact(x)}</li>`).join("")}</ul>` : ""}</div></div>
      <details><summary class="small">منابع (${fa((pf.sources || []).length)}) — بیشتر از تیتر خبرها؛ پیش از تصمیم بزرگ، خبر را باز کنید</summary><div style="padding:0 16px 10px">${(pf.sources || []).map(u => `<div class="ltr" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join("")}</div></details></div></div>`
    : `<div class="warnbox" style="margin-bottom:16px">برای ${esc(d.city)} هنوز پروفایل تحقیقی نداریم؛ پیشنهادها فقط از نقشه‌ی تبلیغات است.</div>`}
    <div class="card"><header>بهترین گروه‌ها برای تبلیغ در ${esc(d.city)} — ${esc(d.month_name)}</header><div class="pad grid2">
    ${d.items.map(it => `<div class="rec"><div class="inline" style="justify-content:space-between"><span class="badge b-info">${esc(it.group_name)}</span>
        ${it.strength ? `<span class="badge ${it.strength >= 3 ? "b-ok" : ""}">تقاضای محلی ${S[it.strength] || ""}</span>` : ""}</div>
      <h3>${esc(it.name)}</h3><div class="why">⏱ ${esc(it.why)}</div>
      ${it.reason ? `<div class="small">📍 ${esc(it.reason)}</div>` : ""}
      <div class="meta"><span>کالا: <b>${fa(it.products)}</b> (موجود ${fa(it.in_stock)})</span><span>امتیاز: <b>${fa(it.score)}</b></span>
        ${it.source === "research" ? "<span>از تحقیق شهر</span>" : ""}</div>
      ${prodStrip(it.examples)}
      <div class="inline" style="justify-content:space-between"><span class="small muted">${it.keywords.slice(0, 3).map(esc).join(" · ")}</span>
        <button class="btn sm" data-citycamp="${esc(it.plan_id)}|${it.segment_index}">کمپین برای ${esc(d.city)}</button></div></div>`).join("") || '<div class="empty">برای این ماه پیشنهادی نیست.</div>'}</div></div>`;
  document.querySelectorAll("[data-citycamp]").forEach(b => b.onclick = async () => { const [pid, si] = b.dataset.citycamp.split("|"); b.disabled = true;
    try { const c = await post("/api/campaigns", {plan_id: pid, segment_index: +si, city: d.city, province: d.province}); toast("کمپین " + c.code + " ساخته شد"); location.hash = "#campaigns/" + c.id; }
    catch (e) { toast(e.message); b.disabled = false; } });
}

// ================= ASSISTANT =================
async function assistant(){
  const s = await api("/api/assistant"); const base = location.origin;
  $("#view").innerHTML = `<div class="grid2"><div class="card"><h2>امتحان دستیار</h2><div class="pad">
      <div class="inline" style="flex-wrap:nowrap"><input type="text" id="aQ" placeholder="مثلاً: قیمت پمپ شناور ۳ اسب چنده؟"><button class="btn sm" id="aGo">بپرس</button></div>
      <div id="aOut" style="margin-top:10px"></div></div></div>
    <div class="card"><h2>کانال‌های دستیار</h2><div class="pad small">
      <div><b>پنجره‌ی گفت‌وگوی سایت:</b> این یک خط را در وردپرس (Elementor ← Custom Code یا افزونه‌ی «Insert Headers and Footers»، بخش Footer) اضافه کنید:
        <pre class="raw" style="margin:6px 0">&lt;script src="${esc(base)}/widget.js" defer&gt;&lt;/script&gt;</pre>
        <button class="ghost sm" data-copy3='&lt;script src="${esc(base)}/widget.js" defer&gt;&lt;\/script&gt;'>کپی</button></div>
      <div style="margin-top:12px"><b>ربات تلگرام:</b> ${s.bots.telegram ? '<span class="badge b-ok">توکن تنظیم شده</span>' : '<span class="badge b-warn">توکن ندارد</span>'}
        · <b>ربات بله:</b> ${s.bots.bale ? '<span class="badge b-ok">توکن تنظیم شده</span>' : '<span class="badge b-warn">توکن ندارد</span>'}</div>
      <div class="muted" style="margin-top:4px">ربات را با @BotFather (تلگرام) یا @botfather (بله) بسازید و توکنش را خودتان در Render با نام <code>TELEGRAM_BOT_TOKEN</code> یا <code>BALE_BOT_TOKEN</code> بگذارید؛ بعد این دکمه را بزنید:</div>
      <button class="btn sm" id="botSetup" style="margin-top:6px" ${s.bots.telegram || s.bots.bale ? "" : "disabled"}>اتصال ربات‌ها</button><div id="botOut" class="small"></div>
      <div class="warnbox" style="margin-top:10px">روی پلن رایگان Render، اولین پیام بعد از خواب سرویس حدود یک دقیقه طول می‌کشد. برای استفاده‌ی واقعی، سرویس باید همیشه بیدار باشد (Starter یا VPS).</div></div></div></div>
    <div class="grid2"><div class="card"><h2>بیشترین کالاهای پرسیده‌شده</h2><div class="pad small">${(s.top_products || []).map(p => `<div>${esc(p.name || p.id)} — <b>${fa(p.count)}</b></div>`).join("") || '<div class="muted">هنوز پرسشی نیست.</div>'}</div></div>
      <div class="card"><h2>شهرهای پرسش‌کنندگان</h2><div class="pad small">${(s.top_cities || []).map(([c, n]) => `<div>${esc(c)} — <b>${fa(n)}</b></div>`).join("") || '<div class="muted">هنوز شهری گفته نشده.</div>'}</div></div></div>
    <div class="card"><header>آخرین پرسش‌ها <span class="small muted">${fa(s.total)} پرسش · ${Object.entries(s.by_channel || {}).map(([k, v]) => esc(k) + " " + fa(v)).join(" · ")}</span></header><div class="tbl"><table><thead><tr><th>زمان</th><th>کانال</th><th>پرسش</th><th>شهر</th><th>جواب</th></tr></thead><tbody>
      ${(s.recent || []).map(r => `<tr><td class="num">${ago(r.ts)}</td><td>${esc(r.channel)}</td><td>${esc(r.question)}</td><td>${esc(r.city || "")}</td><td class="small muted">${esc((r.answer || "").slice(0, 140))}</td></tr>`).join("")}</tbody></table></div></div>`;
  const ask = async () => { const q = $("#aQ").value.trim(); if (!q) return; $("#aOut").innerHTML = '<div class="muted pulse">…</div>';
    try { const r = await post("/api/assistant/ask", {q}); $("#aOut").innerHTML = `<pre class="ad">${esc(r.answer)}</pre>${prodStrip(r.products)}`; } catch (e) { $("#aOut").innerHTML = `<div class="err">${esc(e.message)}</div>`; } };
  $("#aGo").onclick = ask; $("#aQ").onkeydown = e => { if (e.key === "Enter") ask(); };
  document.querySelectorAll("[data-copy3]").forEach(b => b.onclick = () => copy(b.dataset.copy3));
  const bs = $("#botSetup"); if (bs) bs.onclick = async () => { bs.disabled = true; try { const r = await post("/api/bots/setup"); $("#botOut").innerHTML = `<pre class="raw">${esc(JSON.stringify(r, null, 2))}</pre>`; } catch (e) { toast(e.message); } bs.disabled = false; };
}

// ---------------- boot ----------------
if (token) login(token).catch(() => logout()); else logout();
})();
</script>
