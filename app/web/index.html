<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مدیر بازاریابی کاروان صنعت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#fffefb; --surface-2:#efebe2; --ink:#1d2621; --ink-2:#526058; --ink-3:#86918a;
  --line:#e1dccf; --accent:#2c6a4d; --accent-ink:#fff; --accent-soft:#e1eee6;
  --amber:#a86e12; --amber-soft:#faefd9; --red:#b23f2c; --red-soft:#f8e3de; --blue:#2a5a8c; --blue-soft:#e1ebf5;
  --tg:#e8f3eb; --shadow:0 1px 2px rgba(29,38,33,.05),0 6px 18px rgba(29,38,33,.06); --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --surface-2:#212925; --ink:#e7ebe8; --ink-2:#a7b1ab; --ink-3:#76807a;
  --line:#2c3530; --accent:#5fb08a; --accent-ink:#0d1310; --accent-soft:#1e3228;
  --amber:#e0a84a; --amber-soft:#33291a; --red:#e27a66; --red-soft:#3a221d; --blue:#82b2e2; --blue-soft:#1c2a38;
  --tg:#1c2a22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --surface-2:#212925; --ink:#e7ebe8; --ink-2:#a7b1ab; --ink-3:#76807a;
  --line:#2c3530; --accent:#5fb08a; --accent-ink:#0d1310; --accent-soft:#1e3228;
  --amber:#e0a84a; --amber-soft:#33291a; --red:#e27a66; --red-soft:#3a221d; --blue:#82b2e2; --blue-soft:#1c2a38;
  --tg:#1c2a22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:-4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:6px 13px;border-radius:9px;font-weight:600;font-size:13.5px}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.ghost:hover{background:var(--surface-2)}
.ghost.sm{padding:2px 9px;font-size:12px}
.danger{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card>h2,.card>header{font-size:15px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pad{padding:14px 16px}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2>*,.grid3>*,.stats>*{min-width:0}
.rec{min-width:0;overflow:hidden}
.prods{max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.stat b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5}
.stat span{color:var(--ink-3);font-size:12.5px}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin:10px 0 4px;font-weight:600}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 9px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.b-ok{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--amber-soft);color:var(--amber)}
.b-bad{background:var(--red-soft);color:var(--red)} .b-info{background:var(--blue-soft);color:var(--blue)}
.pulse::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:5px;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.empty{color:var(--ink-3);text-align:center;padding:26px 12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--ink-3);font-weight:600;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.rec h3{margin:0;font-size:14.5px;line-height:1.6}
.rec .why{color:var(--accent);font-weight:600;font-size:13px}
.rec .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-3);font-size:12.5px}
.rec .meta b{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--surface-2);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2)}
.chip.kw{background:var(--blue-soft);color:var(--blue);cursor:pointer;border:0}
.prods{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.prod{flex:none;width:120px;font-size:11.5px;line-height:1.5;text-decoration:none;color:var(--ink-2)}
.prod img{width:120px;height:90px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:3px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.err{background:var(--red-soft);color:var(--red);border-radius:9px;padding:7px 11px;font-size:13px;margin-top:8px}
.note{background:var(--blue-soft);color:var(--blue);border-radius:9px;padding:9px 12px;font-size:13px}
.warnbox{background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:9px 12px;font-size:13px}
pre.ad{white-space:pre-wrap;background:var(--tg);border-radius:12px;padding:12px 14px;margin:0;font:inherit;font-size:13.5px;line-height:1.9}
pre.raw{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;max-height:480px;white-space:pre-wrap}
details{border-top:1px solid var(--line)}
details>summary{cursor:pointer;padding:10px 16px;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"◂ ";color:var(--ink-3)}
details[open]>summary::before{content:"▾ "}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.ltr{direction:ltr;unicode-bidi:embed}
.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto 0}
#login .logo{margin:0 auto 12px;width:52px;height:52px;font-size:22px}
/* studio */
.job{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.job:hover,.job.sel{background:var(--surface-2)}
.ticon{width:32px;height:32px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.type{position:relative}.type input{position:absolute;opacity:0;inset:0;cursor:pointer}
.type div{border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;font-size:13px;background:var(--bg)}
.type input:checked+div{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.bubble{background:var(--tg);border-radius:14px 14px 4px 14px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px;line-height:1.9}
.caption{background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px}
.grid2.studio{grid-template-columns:340px 1fr}
.chlist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.chlist label{display:flex;gap:6px;align-items:baseline;cursor:pointer;padding:2px 0}
.grid2.keep{grid-template-columns:1fr 1fr!important}
@media (max-width:920px){.grid2.studio{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="login" class="wrap hidden">
  <div class="card pad">
    <div class="logo">ک</div>
    <h2 style="text-align:center;margin:0 0 4px;font-size:18px">مدیر بازاریابی کاروان صنعت</h2>
    <p class="muted small" style="text-align:center;margin:0 0 14px">برای ورود، مقدار <code>RUN_TOKEN</code> را از بخش Environment سرویس در Render وارد کنید.</p>
    <form id="loginForm">
      <label class="f" for="tok">رمز ورود</label>
      <input type="password" id="tok" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:12px" type="submit">ورود</button>
      <div class="err hidden" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap hidden">
  <header class="top">
    <div class="brand"><div class="logo">ک</div>
      <div><h1>مدیر بازاریابی</h1><small id="today"></small></div></div>
    <div class="inline">
      <button class="ghost" id="themeBtn" aria-label="تغییر تم">🌓</button>
      <button class="ghost" id="logoutBtn">خروج</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#home">خانه</a><a href="#plan">برنامه‌ی تبلیغ</a><a href="#campaigns">کمپین‌ها</a>
    <a href="#channels">کانال‌ها</a><a href="#report">گزارش</a><a href="#map">نقشه</a>
    <a href="#studio">استودیو محتوا</a><a href="#settings">تنظیمات</a>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("ce_token") || "", ME = null, timer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = n => n == null || n === "" ? "–" : Number(n).toLocaleString("fa-IR");
const toman = n => n ? fa(n) + " تومان" : "–";
const mtoman = n => !n ? "–" : (n >= 1e6 ? fa(Math.round(n / 1e5) / 10) + " میلیون" : fa(n));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const ago = iso => { if (!iso) return "–"; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "همین الان"; if (s < 3600) return fa(Math.floor(s/60)) + " دقیقه پیش";
  if (s < 86400) return fa(Math.floor(s/3600)) + " ساعت پیش"; return fa(Math.floor(s/86400)) + " روز پیش"; };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
function copy(text){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("کپی شد"), () => toast("کپی نشد؛ دستی انتخاب کنید")); }

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type":"application/json","X-Run-Token":token}});
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const post = (p, body) => api(p, {method:"POST", body: JSON.stringify(body || {})});

// ---------------- auth / theme ----------------
async function login(t){ token = t; ME = await api("/api/me"); store.set("ce_token", t);
  $("#today").textContent = "امروز " + ME.jalali; $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); route(); }
function logout(){ token = ""; store.del("ce_token"); clearTimeout(timer); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
$("#loginForm").addEventListener("submit", async e => { e.preventDefault(); const er = $("#loginErr"); er.classList.add("hidden");
  try { await login($("#tok").value.trim()); } catch { er.textContent = "رمز ورود درست نیست."; er.classList.remove("hidden"); } });
$("#logoutBtn").onclick = logout;
const applyTheme = t => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("ce_theme"));
$("#themeBtn").onclick = () => { const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
  const t = dark ? "light" : "dark"; store.set("ce_theme", t); applyTheme(t); };

// ---------------- router ----------------
const VIEWS = {home, plan, campaigns, channels, report, map, studio, settings};
window.addEventListener("hashchange", route);
function route(){ clearTimeout(timer); const v = (location.hash || "#home").slice(1).split("/")[0];
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + v));
  const fn = VIEWS[v] || home; $("#view").innerHTML = '<div class="empty">در حال بارگذاری…</div>';
  fn().catch(e => { if (e.message !== "unauthorized") $("#view").innerHTML = `<div class="err">${esc(e.message)}</div>`; }); }
const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(() => fn().catch(() => {}), ms); };

// ---------------- shared pieces ----------------
function prodStrip(list){ if (!list?.length) return ""; return `<div class="prods">${list.map(p => `<a class="prod" href="${esc(p.url || p.permalink || "#")}" target="_blank" rel="noopener">
  ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ""}${esc((p.name || "").slice(0, 60))}<br><b>${p.price ? mtoman(p.price) : ""}</b></a>`).join("")}</div>`; }
function recCard(r, opts = {}){
  return `<div class="rec">
    <div class="inline" style="justify-content:space-between"><span class="badge b-info">${esc(r.group_name)}</span>
      ${r.pilot ? `<span class="badge b-ok">پیشنهاد کمپین آزمایشی</span>` : ""}</div>
    <h3>${esc(r.name)}</h3>
    <div class="why">⏱ ${esc(r.why)}</div>
    <div><b>${esc(r.segment)}</b> <span class="muted small">— ${esc((r.provinces || []).join("، "))}</span></div>
    <div class="small muted">${esc((r.cities || "").slice(0, 160))}</div>
    <div class="meta"><span>کالا در سایت: <b>${fa(r.products)}</b> (موجود ${fa(r.in_stock)})</span>
      ${r.p90_price ? `<span>رده‌ی قیمت: <b>تا ${mtoman(r.p90_price)}</b></span>` : ""}
      ${r.budget_toman ? `<span>بودجه‌ی پیشنهادی: <b>${mtoman(r.budget_toman)}</b> (~${fa(r.est_placements)} تبلیغ)</span>` : ""}
      <span>امتیاز: <b>${fa(r.score)}</b></span></div>
    ${opts.full ? `<div class="small"><b>خریدار:</b> ${esc(r.buyers)}</div><div class="small"><b>پیام:</b> ${esc(r.angle)}</div>
      <div class="small"><b>زمان انتشار:</b> ${esc(r.time)}</div>${r.note ? `<div class="small muted">💡 ${esc(r.note)}</div>` : ""}` : ""}
    ${prodStrip(r.examples)}
    <div class="inline" style="justify-content:space-between;margin-top:4px">
      <span class="small muted">${opts.full ? "جست‌وجوی کانال: " + (r.keywords || []).slice(0, 4).map(esc).join(" · ") : ""}</span>
      <button class="btn sm" data-mkcamp="${esc(r.plan_id)}|${r.segment_index}|${r.budget_toman || ""}">ساخت کمپین</button></div>
  </div>`;
}
function bindMakeCampaign(root){
  root.querySelectorAll("[data-mkcamp]").forEach(b => b.onclick = async () => {
    const [pid, si, bud] = b.dataset.mkcamp.split("|"); b.disabled = true;
    try { const c = await post("/api/campaigns", {plan_id: pid, segment_index: +si, budget_toman: bud ? +bud : null});
      toast("کمپین " + c.code + " ساخته شد"); location.hash = "#campaigns/" + c.id; }
    catch (e) { toast(e.message); b.disabled = false; } });
}
function syncBadge(s){
  if (s.running) return `<span class="badge b-warn pulse">در حال همگام‌سازی</span>`;
  if (!s.initial_done_at) return `<span class="badge b-warn">بارگذاری اولیه ناتمام</span>`;
  return `<span class="badge b-ok">به‌روز · ${ago(s.last_daily_at)}</span>`;
}

// ================= HOME =================
async function home(){
  const d = await api("/api/overview"); const s = d.sync, rp = d.report || {};
  const pct = s.site_total ? Math.min(100, Math.round(100 * s.products / s.site_total)) : 0;
  $("#view").innerHTML = `
  <section class="stats">
    <div class="stat"><b>${fa(s.products)}</b><span>محصول همگام‌شده ${s.site_total ? "از " + fa(s.site_total) : ""}</span></div>
    <div class="stat"><b>${fa(d.active_campaigns)}</b><span>کمپین فعال</span></div>
    <div class="stat"><b>${mtoman(rp.spent || 0)}</b><span>هزینه‌ی تبلیغ (تومان)</span></div>
    <div class="stat"><b>${rp.roas != null ? fa(rp.roas) + "×" : "–"}</b><span>بازگشت هزینه (درآمد ÷ هزینه)</span></div>
  </section>
  ${!s.initial_done_at ? `<div class="card pad"><div class="inline" style="justify-content:space-between"><b>بارگذاری محصولات سایت</b>${syncBadge(s)}</div>
    <div class="bar" style="margin:10px 0 6px"><i style="width:${pct}%"></i></div>
    <div class="small muted">سرور سایت کند است؛ برای اینکه سایت زیر فشار نرود، محصولات آرام و تکه‌تکه خوانده می‌شوند و بارگذاری اول چند ساعت طول می‌کشد. تا آن موقع برنامه با آمار فایل نقشه کار می‌کند.</div></div>` : ""}
  <div class="card"><header><span>📅 این هفته چه تبلیغ کنیم؟ <span class="muted small">(${esc(d.month_name)} · بودجه‌ی ماهانه ${mtoman(d.budget_toman)} تومان)</span></span>
    <a class="ghost sm" href="#plan" style="text-decoration:none">همه‌ی پیشنهادها</a></header>
    <div class="pad grid3">${d.recommendations.slice(0, 3).map(r => recCard(r)).join("") || '<div class="empty">برای این ماه پیشنهادی نیست.</div>'}</div></div>
  <div class="grid2">
    <div class="card"><header>وضعیت داده‌ها ${syncBadge(s)}</header><div class="pad small">
      <div>دسته‌های نقشه: <b>${fa((d.plan.base || 0) + (d.plan.approved || 0))}</b> فعال${d.plan.proposed ? ` · <a href="#map">${fa(d.plan.proposed)} پیشنهاد جدید منتظر تأیید</a>` : ""}</div>

  const mon = m => ["فرو","ارد","خرد","تیر","مرد","شهر","مهر","آبا","آذر","دی","بهم","اسف"][m-1];
  $("#view").innerHTML = `
  <div class="note" style="margin-bottom:16px">نقشه هر روز با محصولات سایت به‌روز می‌شود: دسته‌های جدید سایت خودکار به ردیف مناسب نقشه وصل می‌شوند، آمار هر ردیف (تعداد کالا، موجودی، قیمت) از سایت خوانده می‌شود، و اگر گروه کالایی پیدا شود که در نقشه نیست، یک ردیف پیشنهادی برای تأیید شما ساخته می‌شود.
    <div style="margin-top:6px">دسته‌های سایت: <b>${fa(cm.mapped || 0)}</b> وصل‌شده · <b>${fa(cm.none || 0)}</b> بدون ردیف · <b>${fa(cm.unmapped || 0)}</b> در صف بررسی</div></div>
  ${proposed.length ? `<div class="card"><h2>ردیف‌های پیشنهادی جدید (${fa(proposed.length)})</h2><div class="pad grid2">${proposed.map(p => `<div class="rec">
    <h3>${esc(p.name)} <span class="badge b-warn">پیشنهاد</span></h3><div class="small"><b>خریدار:</b> ${esc(p.buyers)}</div><div class="small"><b>پیام:</b> ${esc(p.angle)}</div>
    ${(p.segments || []).map(s => `<div class="small">• ${esc(s.name)}: ${esc((s.provinces || []).join("، "))} — اوج ${esc((s.peak || []).map(mon).join("، "))}</div>`).join("")}
    <div class="inline"><button class="btn sm" data-pst="${esc(p.id)}|approved">تأیید</button><button class="ghost sm danger" data-pst="${esc(p.id)}|rejected">رد</button></div></div>`).join("")}</div></div>` : ""}
  <div class="card"><header>ردیف‌های نقشه (${fa(active.length)})<input type="text" id="mapQ" placeholder="جست‌وجو…" style="width:200px"></header><div class="tbl"><table><thead><tr><th>دسته</th><th>گروه</th><th>کالا</th><th>موجود</th><th>میانه‌ی قیمت</th><th>تازه (۷ روز)</th><th>اوج‌ها</th></tr></thead><tbody id="mapBody">
  ${active.map(p => `<tr data-name="${esc(p.name)}"><td>${esc(p.name)} ${p.source === "llm" ? '<span class="badge b-info">جدید</span>' : ""}</td><td class="small">${esc(G[p.group] || p.group)}</td><td class="num">${fa(p.product_count)}</td><td class="num">${fa(p.in_stock_count)}</td><td class="num">${mtoman(p.median_price)}</td><td class="num">${p.new_7d ? `<b>${fa(p.new_7d)}</b>` : "–"}</td>
    <td class="small">${(p.segments || []).map(s => `${esc(s.name.split("—")[0].trim())}: ${(s.peak || []).map(mon).join("،")}`).join("<br>")}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>دسته‌های سایت بدون ردیف نقشه (${fa(um.length)})</h2><div class="tbl">${um.length ? `<table><thead><tr><th>دسته</th><th>کالا</th><th>وصل به</th></tr></thead><tbody>
    ${um.map(c => `<tr><td><a href="${esc(c.permalink || "#")}" target="_blank" rel="noopener">${esc(c.path || c.name)}</a></td><td class="num">${fa(c.count)}</td>
    <td><select data-cmap="${c.id}" style="max-width:280px"><option value="">— انتخاب —</option>${items.filter(p => p.status !== "rejected").map(p => `<option value="${esc(p.id)}">${esc(p.name.slice(0, 60))}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>` : '<div class="empty">همه‌ی دسته‌ها وصل شده‌اند (یا هنوز بررسی نشده‌اند).</div>'}</div></div>`;
  $("#mapQ").oninput = e => { const q = e.target.value.trim(); document.querySelectorAll("#mapBody tr").forEach(tr => tr.classList.toggle("hidden", q && !tr.dataset.name.includes(q))); };
  document.querySelectorAll("[data-pst]").forEach(b => b.onclick = async () => { const [id, st] = b.dataset.pst.split("|"); await post("/api/plan/" + id, {status: st}); toast("ذخیره شد"); map(); });
  document.querySelectorAll("[data-cmap]").forEach(s => s.onchange = async () => { if (!s.value) return; await post("/api/categories/" + s.dataset.cmap, {plan_id: s.value}); toast("وصل شد"); });
}

// ================= SETTINGS =================
async function settings(){
  const [s, sy] = await Promise.all([api("/api/settings"), api("/api/sync")]);
  const w = s["planner.weights"] || {};
  $("#view").innerHTML = `<div class="grid2"><div class="card"><h2>بودجه و اولویت‌ها</h2><div class="pad">
    <label class="f">بودجه‌ی ماهانه‌ی تبلیغ (تومان)</label><input type="text" inputmode="numeric" id="sBudget" value="${s["budget.monthly_toman"] ?? ""}">
    <label class="f">میانگین قیمت هر پست تبلیغ (تومان؛ برای تخمین تعداد تبلیغ)</label><input type="text" inputmode="numeric" id="sAvg" value="${s["budget.avg_ad_price_toman"] ?? ""}">
    <label class="f">تعداد کمپین‌های آزمایشی هم‌زمان</label><input type="number" min="1" max="10" id="sPilot" value="${s["planner.pilot_size"] ?? 3}">
    <label class="f">وزن هر گروه در برنامه (۱ = عادی؛ بیشتر = مهم‌تر)</label>
    <div class="grid2" style="gap:6px">${Object.entries(s.groups).map(([k, n]) => `<div class="inline" style="flex-wrap:nowrap"><span class="small" style="flex:1">${esc(n)}</span><input type="number" step="0.05" min="0" max="3" data-w="${k}" value="${w[k] ?? 1}" style="width:80px"></div>`).join("")}</div>
    <button class="btn" id="sSave" style="margin-top:14px">ذخیره</button></div></div>
  <div class="card"><h2>همگام‌سازی با سایت ${syncBadge(sy)}</h2><div class="pad small">
    <div>محصولات: <b>${fa(sy.products)}</b> از ${fa(sy.site_total)} · موجود: <b>${fa(sy.in_stock)}</b> · دسته‌ها: <b>${fa(sy.categories)}</b></div>
    <div>بارگذاری اولیه: <b>${sy.initial_done_at ? "تمام شده " + ago(sy.initial_done_at) : "در جریان (صفحه‌ی " + fa(sy.full_page) + ")"}</b></div>
    <div>آخرین اجرای روزانه: <b>${ago(sy.last_daily_at)}</b></div>
    <button class="btn sm" id="syncNow" style="margin:10px 0" ${sy.running ? "disabled" : ""}>اجرای همگام‌سازی الان</button>
    <div class="tbl"><table><thead><tr><th>شروع</th><th>نتیجه</th><th>جزئیات</th></tr></thead><tbody>${(sy.runs || []).map(r => `<tr><td class="num">${ago(r.started_at)}</td>
      <td>${r.ok == null ? '<span class="badge b-warn pulse">در جریان</span>' : r.ok ? '<span class="badge b-ok">موفق</span>' : '<span class="badge b-bad">خطا</span>'}</td>
      <td class="small"><code class="ltr" style="font-size:11px">${esc(JSON.stringify(r.stats || {}).slice(0, 220))}</code>${r.error ? `<div class="danger">${esc(r.error.slice(0, 200))}</div>` : ""}</td></tr>`).join("")}</tbody></table></div></div></div></div>
  <div class="card"><h2>اتصال سفارش‌ها ${s.orders_enabled ? '<span class="badge b-ok">فعال</span>' : '<span class="badge b-warn">غیرفعال</span>'}</h2><div class="pad small">
    ${s.orders_enabled ? "سفارش‌های سایت روزانه خوانده می‌شوند و هر سفارشی که از لینک یک تبلیغ آمده باشد، خودکار به همان تبلیغ وصل می‌شود." :
    `برای شمارش خودکار سفارش‌ها:<ol style="margin:6px 0;padding-right:20px"><li>در پیشخوان وردپرس: ووکامرس ← پیکربندی ← پیشرفته ← REST API ← افزودن کلید.</li>
    <li>دسترسی را <b>فقط خواندن (Read)</b> بگذارید.</li><li>دو مقدار Consumer key و Consumer secret را خودتان در Render، سرویس content-engine ← Environment با نام‌های <code>WC_CONSUMER_KEY</code> و <code>WC_CONSUMER_SECRET</code> وارد کنید.</li></ol>
    ووکامرس منبع هر سفارش را ذخیره می‌کند؛ لینک‌های تبلیغ ما کد تبلیغ را همراه دارند، پس سفارش‌ها خودکار به تبلیغ وصل می‌شوند.`}</div></div>`;
  $("#sSave").onclick = async () => { const n = v => v.replace(/[٬,]/g, "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    const weights = {}; document.querySelectorAll("[data-w]").forEach(i => weights[i.dataset.w] = +i.value);
    try { await post("/api/settings", {"budget.monthly_toman": n($("#sBudget").value), "budget.avg_ad_price_toman": n($("#sAvg").value), "planner.pilot_size": $("#sPilot").value, "planner.weights": weights}); toast("ذخیره شد"); }
    catch (e) { toast(e.message); } };
  $("#syncNow").onclick = async () => { try { await post("/api/sync", {}); toast("همگام‌سازی شروع شد"); setTimeout(settings, 1500); } catch (e) { toast(e.message); } };
  if (sy.running) later(settings, 15000);
}

// ================= STUDIO =================
const TYPE = {text:{i:"📝",n:"متنی"}, infographic:{i:"📊",n:"اینفوگرافیک"}, video:{i:"🎬",n:"ویدئو"}};
const JST = {pending:"در صف", generating:"در حال تولید", generated:"آماده", failed:"خطا"};
let selJob = null;
async function studio(){
  const jobs = await api("/api/jobs?limit=40");
  const SUG = ["علت سوختن پمپ شناور چاه و راه جلوگیری", "انتخاب بذر خربزه برای کشت زمستانه جنوب", "۵ نکته‌ی نگهداری الکتروموتور در کارخانه", "راهنمای انتخاب سمپاش باغی"];
  $("#view").innerHTML = `<div class="grid2 studio"><div class="card"><h2>محتوای جدید</h2><form class="pad" id="genForm">
    <label class="f" for="topic">موضوع</label><textarea id="topic" maxlength="300" required placeholder="مثلاً: علت سوختن پمپ شناور چاه"></textarea>
    <div class="chips" style="margin-top:6px">${SUG.map(s => `<button type="button" class="chip kw" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="types">${Object.entries(TYPE).map(([k, t], i) => `<label class="type"><input type="checkbox" name="type" value="${k}" ${i === 0 ? "checked" : ""}><div>${t.i}<br>${t.n}</div></label>`).join("")}</div>
    <label class="f">مدل (اختیاری)</label><input type="text" id="model" dir="ltr" placeholder="${esc(ME.default_model)}" list="mdl"><datalist id="mdl"><option value="~deepseek/deepseek-pro-latest"><option value="~deepseek/deepseek-flash-latest"></datalist>
    <button class="btn" style="width:100%;margin-top:12px" id="genBtn">تولید محتوا</button></form></div>
    <div><div class="card"><h2>محتواها</h2><div style="padding:6px">${jobs.length ? jobs.map(j => `<div class="job ${j.id === selJob ? "sel" : ""}" data-job="${j.id}"><div class="ticon">${TYPE[j.type]?.i}</div>
      <div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(j.title || j.topic)}</div><div class="small muted">${TYPE[j.type]?.n} · ${ago(j.created_at)}</div></div>
      <span class="badge ${j.status === "generated" ? "b-ok" : j.status === "failed" ? "b-bad" : "b-warn pulse"}">${JST[j.status]}</span></div>`).join("") : '<div class="empty">هنوز محتوایی نیست.</div>'}</div></div>
      <div class="card hidden" id="jobDetail"></div></div></div>`;
  document.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => $("#topic").value = b.dataset.sug);
  $("#genForm").onsubmit = async e => { e.preventDefault(); const types = [...document.querySelectorAll("input[name=type]:checked")].map(i => i.value);
    if (!types.length) { toast("یک نوع انتخاب کنید"); return; } $("#genBtn").disabled = true;
    try { const r = await post("/api/generate", {topic: $("#topic").value.trim(), types, model: $("#model").value.trim()}); selJob = r.job_ids[0]; studio(); }
    catch (ex) { toast(ex.message); $("#genBtn").disabled = false; } };
  document.querySelectorAll("[data-job]").forEach(el => el.onclick = () => { selJob = el.dataset.job; studio(); });
  if (selJob) showJob(selJob);
  if (jobs.some(j => j.status === "pending" || j.status === "generating")) later(studio, 5000);
}
async function showJob(id){
  const j = await api("/api/jobs/" + id); const box = $("#jobDetail"); if (!box) return; box.classList.remove("hidden"); const o = j.output || {};
  let body;
  if (j.status === "failed") body = `<div class="err">${esc(j.error)}</div>`;
  else if (j.status !== "generated") body = '<div class="empty pulse">در حال تولید…</div>';
  else if (j.type === "text") body = `<div class="grid2"><div><div class="small muted">تلگرام</div><div class="bubble">${md(o.telegram_text)}</div><button class="ghost sm" style="margin-top:6px" data-copy2="${esc(o.telegram_text || "")}">کپی</button></div>
    <div><div class="small muted">اینستاگرام</div><div class="caption">${esc(o.instagram_caption)}</div><div class="chips" style="margin-top:6px">${(o.hashtags || []).map(h => `<span class="chip">${esc(h)}</span>`).join("")}</div></div></div>`;
  else if (j.type === "infographic") body = `<h3 style="margin:0">${esc(o.title)}</h3><div class="muted">${esc(o.subtitle || "")}</div><ul>${(o.items || []).map(i => `<li><b>${esc(i.title)}</b>: ${esc(i.desc)}</li>`).join("")}</ul>${o.tip ? `<div class="note">💡 ${esc(o.tip)}</div>` : ""}<div class="caption" style="margin-top:8px">${esc(o.caption)}</div>`;
  else body = `<div class="small muted">${fa(o.duration_sec)} ثانیه · ${fa((o.scenes || []).length)} صحنه</div><div class="tbl"><table><thead><tr><th>#</th><th>روی تصویر</th><th>گوینده</th></tr></thead><tbody>${(o.scenes || []).map(s => `<tr><td class="num">${fa(s.index)}</td><td><b>${esc(s.on_screen_text)}</b><div class="small muted ltr">${esc(s.visual?.query)}</div></td><td>${esc(s.voiceover)}</td></tr>`).join("")}</tbody></table></div>`;
  box.innerHTML = `<header><span>${TYPE[j.type]?.i} ${esc(j.title || j.topic)}</span><span class="small muted">${esc(j.model || "")} ${j.cost_usd != null ? "· $" + j.cost_usd.toFixed(4) : ""}</span></header><div class="pad">${body}</div>`;
  box.querySelectorAll("[data-copy2]").forEach(b => b.onclick = () => copy(b.dataset.copy2));
}

// ---------------- boot ----------------
if (token) login(token).catch(() => logout()); else logout();
})();
</script>
</body>
