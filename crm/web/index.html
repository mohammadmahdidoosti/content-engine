<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155446">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/Vazirmatn-FD-Regular.woff2" as="font" type="font/woff2" crossorigin>
<title>CRM کاروان صنعت</title>
<style>
@font-face{font-family:Vz;src:url(/fonts/Vazirmatn-FD-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vz;src:url(/fonts/Vazirmatn-FD-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Vz;src:url(/fonts/Vazirmatn-FD-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vz;src:url(/fonts/Vazirmatn-FD-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  --bg:#f3f4f1;--card:#fff;--card2:#f8f9f7;--ink:#17201d;--ink2:#5d6964;--ink3:#8b9590;--line:#e4e7e3;
  --brand:#155446;--brand2:#1f7a64;--brand-soft:#e2f0eb;--accent:#e08a1e;--accent-soft:#fdf0dd;
  --bad:#c0392b;--bad-soft:#fbe7e4;--ok:#1d8a4a;--ok-soft:#e1f4e8;--blue:#2c62b8;--blue-soft:#e6eefb;--violet:#6b4bb8;--violet-soft:#efe9fb;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.06);--r:16px;--head:#155446;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1312;--card:#181d1b;--card2:#1e2421;--ink:#e8ede9;--ink2:#a5b0ab;--ink3:#76817c;--line:#28302d;
  --brand:#3fae8c;--brand2:#56c29f;--brand-soft:#173029;--accent:#f0a64a;--accent-soft:#33260f;
  --bad:#f08a7e;--bad-soft:#3a1d1a;--ok:#6fd096;--ok-soft:#173222;--blue:#8db2f2;--blue-soft:#1b2840;--violet:#b9a3f0;--violet-soft:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
  --head:#123f35;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vz,Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.65}
a{color:var(--blue);text-decoration:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}

/* سربرگ */
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{opacity:.7;font-size:11.5px}
.me{color:#fff;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:14px}
main{padding:14px 14px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* نوار پایین */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:6;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;color:var(--ink3);font-size:11.5px;font-weight:500;border-radius:12px}
nav.tabs a.on{color:var(--brand)}
nav.tabs a.on svg{stroke-width:2.3}
nav.tabs a.fab{position:relative;top:-16px;flex:none;width:58px;height:58px;margin:0 6px;border-radius:50%;background:var(--accent);color:#fff;justify-content:center;box-shadow:0 6px 18px rgba(224,138,30,.45);border:4px solid var(--bg)}
nav.tabs a.fab svg{width:26px;height:26px;stroke-width:2.5}

/* اجزای پایه */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.sec h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--line);color:var(--ink2);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.cnt.hot{background:var(--bad);color:#fff}
h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:12.5px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.s-new{background:var(--blue-soft);color:var(--blue)}.s-quoted{background:var(--violet-soft);color:var(--violet)}.s-followup{background:var(--accent-soft);color:var(--accent)}
.s-invoice{background:var(--brand-soft);color:var(--brand)}.s-won{background:var(--ok-soft);color:var(--ok)}.s-lost{background:var(--bad-soft);color:var(--bad)}
.c-new{--c:var(--blue)}.c-quoted{--c:var(--violet)}.c-followup{--c:var(--accent)}.c-invoice{--c:var(--brand)}.c-won{--c:var(--ok)}.c-lost{--c:var(--bad)}
.empty{text-align:center;padding:26px 12px;color:var(--ink2)}
.empty .big{font-size:34px;line-height:1;margin-bottom:6px}

/* فرم */
label{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin:14px 2px 6px}
input,select,textarea{width:100%;font:inherit;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand2);background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
textarea{min-height:76px;resize:vertical}
.field{position:relative}
.field svg{position:absolute;top:50%;right:13px;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.field input{padding-right:40px}
.phone{font-size:20px;font-weight:700;letter-spacing:1px;text-align:left;direction:ltr}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
button.ghost{background:var(--brand-soft);color:var(--brand)}
button.soft{background:var(--card2);color:var(--ink);border:1.5px solid var(--line)}
button.danger{background:transparent;color:var(--bad);font-weight:500}
button.full{width:100%;margin-top:14px;padding:14px}
button:disabled{opacity:.5}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .cnt{height:18px;min-width:18px;font-size:11px;margin-right:4px;background:rgba(127,127,127,.18);color:inherit}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid4 .chip{padding:7px 0}
.stickybar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));z-index:4;margin-top:6px}
.stickybar button{box-shadow:0 6px 18px rgba(21,84,70,.3)}

/* قهرمان امروز */
.hero{background:linear-gradient(135deg,var(--head) 0%,#0f3f35 100%);color:#fff;border-radius:20px;padding:18px 16px 14px;margin-bottom:6px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .hi{font-size:13px;opacity:.8}.hero .date{font-size:20px;font-weight:800;margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.3}.stat span{font-size:11.5px;opacity:.8}
.stat.alert{background:var(--accent)}
.funnel{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:4px 0 10px}
.funnel i{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.legend a{color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.legend a i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink)}

/* کارت درخواست */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.deal{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.deal:last-child{border-bottom:0}
.deal:active{background:var(--card2)}
.deal:before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;border-radius:3px 0 0 3px;background:var(--c)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:hsl(var(--h) 45% 46%)}
.deal .body{flex:1;min-width:0}
.deal .t1{display:flex;align-items:center;gap:8px}
.deal .t1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink3);margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:3px}
.due{font-weight:700}.due.late{color:var(--bad)}.due.today{color:var(--accent)}
.callbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.more{display:block;width:100%;text-align:center;padding:12px;color:var(--brand);font-weight:700;background:var(--card2);border-radius:0}

/* برگه‌ی جزئیات */
.sheet{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .18s}
.sheet .in{background:var(--bg);width:100%;max-width:720px;margin:0 auto;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 14px calc(26px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{background:rgba(0,0,0,0)}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.who .av{width:52px;height:52px;font-size:20px}
.who b{font-size:17px;display:block;line-height:1.3}
.x{width:38px;height:38px;border-radius:50%;padding:0;background:var(--card);color:var(--ink2);margin-right:auto;box-shadow:var(--shadow)}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:14px;font-weight:700;font-size:14px}
.acts .call{background:var(--ok);color:#fff}
.acts .alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.steps{display:flex;gap:4px;margin-bottom:6px}
.steps button{flex:1;min-width:0;line-height:1.35;padding:8px 2px 6px;border-radius:10px;background:var(--card2);color:var(--ink2);font-size:11.5px;font-weight:500;flex-direction:column;gap:3px;border:1.5px solid transparent}
.steps button i{width:100%;height:4px;border-radius:4px;background:var(--line)}
.steps button.done i{background:var(--c)}
.steps button.on{border-color:var(--c);color:var(--c);font-weight:800;background:var(--card)}
.steps button.on i{background:var(--c)}
.lostbtn{margin-top:6px;width:100%;background:transparent;color:var(--bad);border:1.5px dashed var(--bad-soft);font-weight:500;padding:9px}
.lostbtn.on{background:var(--bad-soft);border-style:solid}
.tl{position:relative;padding-right:18px}
.tl:before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:12px}
.tl .ev:before{content:"";position:absolute;right:-17px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--brand2)}
.tl .ev.call:before{background:var(--brand2)}
.known{margin-top:10px;padding:12px;border-radius:14px;background:var(--brand-soft);font-size:13px}

/* گزارش */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:19px;font-weight:800}.kpi span{font-size:11.5px;color:var(--ink2)}
.bar{margin-bottom:10px}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .tr{height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.set{display:flex;gap:12px;align-items:flex-start}
.set .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.code{font-size:26px;font-weight:800;letter-spacing:4px;background:var(--card2);border:1.5px dashed var(--line);border-radius:12px;padding:6px 16px;display:inline-block;direction:ltr}

/* ورود */
.login{min-height:calc(100vh - 140px);display:grid;place-items:center}
.login .card{width:100%;max-width:380px;padding:26px 20px}
.login .logo{width:58px;height:58px;border-radius:18px;background:var(--brand);color:#fff;margin:0 auto 10px}

.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:30;font-size:13.5px;font-weight:500;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--line) 0%,var(--card2) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (min-width:600px){main{padding-top:20px}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="brand"><div class="logo" id="logoSlot"></div><div><b>کاروان صنعت</b><small>مدیریت مشتری‌ها</small></div></div>
  <a href="#more" class="me" id="me" aria-label="حساب"></a>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#today" data-i="sun">امروز</a>
  <a href="#pipe" data-i="layers">کاریز</a>
  <a href="#add" class="fab" data-i="plus" aria-label="ثبت درخواست"></a>
  <a href="#customers" data-i="users">مشتری‌ها</a>
  <a href="#more" data-i="grid">بیشتر</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = n => n == null || n === "" ? "–" : Number(n).toLocaleString("fa-IR");
const toman = n => n ? fa(n) + " تومان" : "–";
const mil = n => n ? (n >= 1e9 ? fa(Math.round(n / 1e8) / 10) + " میلیارد" : fa(Math.round(n / 1e5) / 10) + " میلیون") : "–";
const fd = s => String(s ?? "").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const en = s => String(s ?? "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
let META = null;

// ---------- آیکن‌ها ----------
const P = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  layers: '<path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>',
  msg: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12Z"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
  tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  cal: '<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  truck: '<path d="M2 6h11v10H2zM13 9h4.5l3.5 3.5V16h-8z"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  upload: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  userplus: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14.5 8.5l2 2"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const I = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ""}</svg>`;

function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2400); }
async function api(path, opts = {}){
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", ...(opts.headers || {})}, credentials: "same-origin"});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { loginView(); throw new Error("ورود لازم است"); }
  if (!r.ok) throw new Error(d.error || ("خطا " + r.status));
  return d;
}

const initial = s => { const t = String(s || "").replace(/^(آقای|خانم|مهندس|دکتر|حاج|جناب)\s+/, "").trim(); return t ? t[0] : "؟"; };

      <div class="meta" style="margin-top:6px">${d.category ? `<span>${I("layers", "s")}${esc(d.category)}</span>` : ""}<span>${I("tag", "s")}${d.ad_code ? "کد " + esc(d.ad_code) : esc(d.source || "منبع نامشخص")}</span><span>${I("cal", "s")}ثبت ${fd(d.created_fa)}</span>${d.amount ? `<span style="color:var(--ok);font-weight:700">${toman(d.amount)}</span>` : ""}</div>
      ${d.note ? `<div style="margin-top:8px;padding:10px;border-radius:10px;background:var(--card2);font-size:14px">${esc(d.note)}</div>` : ""}</div>

      <textarea id="logT" placeholder="نتیجه‌ی تماس… مثلاً: قیمت را فرستادم، با شریکش مشورت می‌کند"></textarea>

  $("#view").innerHTML = head() + skeleton(5);
  const list = await api(`/api/contacts?q=${encodeURIComponent(CUS.q)}&category=${encodeURIComponent(CUS.cat)}&months=${CUS.months.join(",")}`);
  $("#view").innerHTML = head() + `<div class="small muted" style="margin:0 4px 6px">${fa(list.length)} مشتری</div>` + (list.length ? `<div class="list">${list.map(c => `<div class="deal" style="cursor:default">${avatar(c)}
      <div class="body"><div class="t1"><b>${esc(c.name || "بدون نام")}</b>${c.bought ? `<span class="pill s-won">${fa(c.bought)} خرید</span>` : ""}</div>
        <div class="meta">${c.phone ? `<span class="ltr">${fd(c.phone)}</span>` : ""}${c.city ? `<span>${I("pin", "s")}${esc(c.city)}</span>` : ""}${c.activity ? `<span>${esc(c.activity)}</span>` : ""}${c.spent ? `<span style="color:var(--ok)">${mil(c.spent)}</span>` : ""}${c.last ? `<span>آخرین ${fd(c.last)}</span>` : ""}</div>
        ${c.items && c.items.length ? `<div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.items.join("، "))}</div>` : ""}</div>
      ${c.phone ? `<a class="callbtn" href="tel:${esc(c.phone)}" aria-label="تماس">${I("phone")}</a>` : ""}</div>`).join("")}</div>`
    : `<div class="card">${empty("👥", "کسی پیدا نشد.")}</div>`);
  const cq = $("#cq"); cq.onchange = () => { CUS.q = cq.value; customers(); }; cq.onkeydown = e => { if (e.key === "Enter") cq.blur(); };
  $("#fTog").onclick = () => { CUS.open = !(CUS.open || filtered); if (!CUS.open) { CUS.cat = ""; CUS.months = []; } customers(); };
  if ($("#cc")) $("#cc").onchange = e => { CUS.cat = e.target.value; customers(); };
  if ($("#cClr")) $("#cClr").onclick = () => { CUS.cat = ""; CUS.months = []; customers(); };
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const m = +b.dataset.m; CUS.months = CUS.months.includes(m) ? CUS.months.filter(x => x !== m) : [...CUS.months, m]; customers(); });
}

// ---------- بیشتر ----------
let RDAYS = 90;
async function more(){
  $("#view").innerHTML = `<div class="kpis">${[1, 2, 3].map(() => `<div class="kpi"><div class="sk" style="height:40px"></div></div>`).join("")}</div>` + skeleton(2);
  const r = await api("/api/report?days=" + RDAYS);
  const conv = r.total ? Math.round(100 * r.won / r.total) : 0;
  const bars = rows => rows.slice(0, 8).map(x => { const w = Math.max(...rows.map(y => y.deals)) || 1;
    return `<div class="bar"><div class="lb"><span>${esc(x.key)}</span><span class="muted">${fa(x.deals)} درخواست، <b style="color:var(--ok)">${fa(x.won)} خرید</b>${x.revenue ? "، " + mil(x.revenue) : ""}</span></div>
      <div class="tr" style="width:${Math.max(6, 100 * x.deals / w)}%"><i style="width:${100 * x.won / x.deals}%;background:var(--ok)"></i><i style="flex:1;background:var(--brand-soft)"></i></div></div>`; }).join("") || '<div class="muted small">هنوز داده‌ای نیست.</div>';
  const lostMax = Math.max(1, ...r.lost_reasons.map(x => x[1]));
  const b = META.bale;
  const sec = (ic, bg, fg, title, body) => `<div class="card"><div class="set"><div class="ic" style="background:${bg};color:${fg}">${I(ic)}</div><div style="flex:1;min-width:0"><h3 style="margin:6px 0 8px">${title}</h3>${body}</div></div></div>`;
  $("#view").innerHTML = `
    <div class="sec" style="margin-top:4px"><h2>${I("chart")} گزارش</h2>${chips("rd", [["30", "۳۰ روز"], ["90", "۹۰ روز"], ["365", "یک سال"]], String(RDAYS))}</div>
    <div class="kpis"><div class="kpi"><b>${fa(r.total)}</b><span>درخواست</span></div><div class="kpi"><b style="color:var(--ok)">${fa(r.won)}</b><span>خرید · ${fa(conv)}٪</span></div><div class="kpi"><b>${mil(r.revenue)}</b><span>فروش</span></div></div>
    <div class="card"><h3>منبع / کد آگهی</h3>${bars(r.by_source)}<div class="small faint">سبز = خرید، کم‌رنگ = بقیه</div></div>
    <div class="card"><h3>دسته‌ی کالا</h3>${bars(r.by_category)}</div>
    <div class="card"><h3>چرا نخریدند؟</h3>${r.lost_reasons.map(([k, v]) => `<div class="bar"><div class="lb"><span>${esc(k)}</span><b>${fa(v)}</b></div><div class="tr"><i style="width:${100 * v / lostMax}%;background:var(--bad)"></i></div></div>`).join("") || '<div class="muted small">هنوز انصرافی ثبت نشده.</div>'}</div>

    <div class="sec"><h2>${I("grid")} تنظیمات</h2></div>
    ${sec("bell", "var(--accent-soft)", "var(--accent)", "یادآور صبحگاهی بله (۸:۳۰)", b.token ? `
      <div class="small muted">۱) ربات بله‌ی CRM را باز کنید و این کد را برایش بفرستید:</div>
      <div style="margin:8px 0"><span class="code">${fd(b.code)}</span></div>
      <div class="small muted">۲) بعد «اتصال» را بزنید.</div>
      <div class="row" style="margin-top:10px"><button class="ghost" id="bLink">اتصال</button><button class="soft" id="bTest">ارسال آزمایشی</button></div>
      <div class="small" style="margin-top:10px">${b.chats.map(c => `<div class="row sp"><span>✅ ${esc(c.name || c.id)}</span><a href="#" data-unl="${esc(c.id)}" style="color:var(--bad)">قطع</a></div>`).join("") || '<span class="faint">هنوز گفتگویی وصل نشده.</span>'}</div>`
      : '<div class="small muted">توکن ربات بله هنوز روی سرور تنظیم نشده.</div>')}
    ${META.role === "admin" ? sec("userplus", "var(--blue-soft)", "var(--blue)", "کاربر جدید (مثلاً فروشنده)", `
      <input id="nu" class="ltr" style="text-align:left;width:100%" placeholder="نام کاربری انگلیسی، مثلاً sara" autocomplete="off">
      <input id="nn" placeholder="اسم (فارسی)" style="margin-top:8px">
      <input id="np" type="password" placeholder="رمز اولیه (حداقل ۸ حرف)" style="margin-top:8px" autocomplete="new-password">
      <button class="ghost" id="nuGo" style="margin-top:10px">ساخت کاربر</button>
      <div class="small faint" style="margin-top:6px">بعد از اولین ورود، خودش از همین صفحه رمزش را عوض کند.</div>`) : ""}
    ${META.role === "admin" ? sec("upload", "var(--violet-soft)", "var(--violet)", "ورود از فایل اکسل", `
      <div class="small muted">فایل Leads یا «تماس ۱۴۰۵». ردیف تکراری دوباره وارد نمی‌شود.</div>
      <input type="file" id="xl" accept=".xlsx" style="margin-top:8px;padding:9px">
      <button class="ghost" id="xlGo" style="margin-top:8px">ورود فایل</button><div id="xlOut" class="small" style="margin-top:8px"></div>`) : ""}
    ${sec("key", "var(--card2)", "var(--ink2)", "تغییر رمز", `
      <input id="pw0" type="password" placeholder="رمز فعلی" autocomplete="current-password"><input id="pw1" type="password" placeholder="رمز جدید (حداقل ۸ حرف)" style="margin-top:8px" autocomplete="new-password">
      <button class="soft" id="pwGo" style="margin-top:10px">تغییر رمز</button>`)}
    <button class="danger full" id="out">${I("logout", "s")} خروج از حساب ${esc(META.user)}</button>`;
  bindChips($("#view"), "rd", () => { RDAYS = +(picked($("#view"), "rd") || 90); more(); });
  if (b.token) {
    $("#bLink").onclick = async () => { try { await post("/api/bale/link"); toast("✓ وصل شد"); META = await api("/api/meta"); more(); } catch (e) { toast(e.message); } };
    $("#bTest").onclick = async () => { try { const r = await post("/api/bale/test"); toast(r.sent ? "✓ فرستاده شد" : "گفتگویی وصل نیست"); } catch (e) { toast(e.message); } };
    document.querySelectorAll("[data-unl]").forEach(a => a.onclick = async e => { e.preventDefault(); await post("/api/bale/unlink", {id: a.dataset.unl}); META = await api("/api/meta"); more(); });
  }
  if ($("#xlGo")) $("#xlGo").onclick = async () => { const f = $("#xl").files[0]; if (!f) { toast("فایل را انتخاب کنید"); return; }
    $("#xlOut").textContent = "در حال ورود…";
    try { const r = await fetch("/api/import/leads", {method: "POST", body: f, credentials: "same-origin"}); const d = await r.json(); if (!r.ok) throw new Error(d.error);
      $("#xlOut").textContent = `${fa(d.added)} سابقه‌ی تماس، ${fa(d.opened)} درخواست باز، ${fa(d.contacts_only)} مشتری وارد شد؛ ${fa(d.duplicates)} تکراری، ${fa(d.enriched_contacts)} مشتری کامل شد.`; META = await api("/api/meta"); } catch (e) { $("#xlOut").textContent = e.message; } };
  if ($("#nuGo")) $("#nuGo").onclick = async () => { try { await post("/api/users", {username: $("#nu").value, name: $("#nn").value, password: $("#np").value, role: "sales"});
    toast("✓ کاربر ساخته شد"); $("#nu").value = $("#nn").value = $("#np").value = ""; } catch (e) { toast(e.message); } };
  $("#pwGo").onclick = async () => { try { await post("/api/password", {old: $("#pw0").value, new: $("#pw1").value}); toast("✓ رمز عوض شد"); $("#pw0").value = $("#pw1").value = ""; } catch (e) { toast(e.message); } };
  $("#out").onclick = async () => { await post("/api/logout"); loginView(); };
}

const VIEWS = {today, add, pipe, customers, more};
async function route(){
  const v = (location.hash || "#today").slice(1);
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + v));
  window.scrollTo(0, 0);
  try { await (VIEWS[v] || today)(); } catch (e) { if (e.message !== "ورود لازم است") $("#view").innerHTML = `<div class="card">${empty("⚠️", esc(e.message))}</div>`; }
}
async function boot(){
  if (!boot.done) { boot.done = 1; document.querySelectorAll("#tabs a").forEach(a => { a.innerHTML = I(a.dataset.i) + a.innerHTML; }); $("#logoSlot").innerHTML = I("truck"); }
  try { META = await api("/api/meta"); } catch (e) { return; }
  $("#tabs").hidden = false; $("#hdr").hidden = false; $("#me").textContent = initial(META.name || META.user).toUpperCase();
  route();
}
window.addEventListener("hashchange", route);
boot();
})();
</script>
</body>
</html>
